# stage2_yolov8/config.yaml

aws:
  region: us-east-1           # change if needed
  profile: default            # or null if using env vars / instance role

s3:
  bucket: from-camera-trap-1-kateeq73
  images_prefix: images/     # folder containing images

dynamodb:
  table_name: CameraTrapDetections  # create this table manually once:
                                    # PK: image_name (string), SK: timestamp (string) or omit SK

sagemaker:
  role_arn: 'arn:aws:iam::511216578538:role/sagemaker-execution-role-650'   
  endpoint_name: yolov8-camera-trap-endpoint
  instance_type: ml.m5.large
  framework_version: "2.0"
  py_version: "py310"
  model_data_s3: "s3://from-camera-trap-1-kateeq73/model-artifacts/model.tar.gz"

sns:
  topic_arn: "arn:aws:sns:us-east-1:511216578538:wildlife-alerts"

io:
  images_csv: data/images.csv          # will be created by create_images_csv.py
  max_images: 50                     # or an integer like 100 to limit for testing
  score_threshold: 0.05               # filter low-confidence detections
